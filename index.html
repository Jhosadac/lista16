<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consejo de Facultad · Lista 16</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

  <main class="page">

    <!-- ==============================
         HERO con fondo scenario16.jpg
         ============================== -->
    <section class="hero">

      <!-- Logo UNI en la esquina superior izquierda del hero -->
      <a href="#" class="logo-uni" aria-label="Universidad Nacional de Ingeniería">
        <img src="assets/logouni.png" alt="Logo UNI">
      </a>

      <header class="titulo">
        <h1>Consejo de Facultad · Lista 16</h1>
        <p>JUNTOS HACEMOS LA DIFERENCIA</p>
      </header>

      <div class="carousel-wrapper">
        <button class="nav-arrow left" id="prevBtn" aria-label="Anterior">‹</button>
        <div class="carousel" id="carousel"><!-- Las tarjetas se generan por JavaScript --></div>
        <button class="nav-arrow right" id="nextBtn" aria-label="Siguiente">›</button>
      </div>

      <div class="dots" id="dots"><!-- Se generan por JavaScript --></div>

      <footer class="credito"></footer>

      <!-- Mascota + CTA (el botón se superpone sobre la parte inferior de la mascota) -->
      <div class="cta-block">
        <img src="assets/mascota16.png" alt="Mascota Lista 16" class="mascota-hero">
        <a href="#propuestas" class="scroll-cta">
          <span>Ver nuestras propuestas</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </a>
      </div>
    </section>

    <!-- ==============================
         SECCIÓN DE PROPUESTAS (fondo crema)
         ============================== -->
    <section class="propuestas" id="propuestas">
      <header class="propuestas-header">
        <span class="eyebrow">NUESTRO COMPROMISO</span>
        <h2>Nuestras Propuestas</h2>
        <p>16 propuestas concretas para transformar nuestra facultad y acompañar a cada estudiante.</p>
      </header>

      <div class="categorias" id="categorias"><!-- Se genera por JavaScript --></div>

      <footer class="propuestas-footer">
        <p>Lista 16 · TEFIEECS · Consejo de Facultad</p>
      </footer>
    </section>

  </main>

  <!-- Canvas oculto usado únicamente para extraer el color dominante -->
  <canvas id="colorCanvas" style="display:none;"></canvas>

  <script src="index.js"></script>
</body>
</html>
