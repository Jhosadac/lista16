<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consejo de Facultad · Lista 16</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Resplandor de fondo, su color se actualiza según la imagen enfocada -->
  <div id="glow"></div>

  <div class="page">

    <header class="titulo">
      <h1>Consejo de Facultad · Lista 16</h1>
      <p>JUNTOS HACEMOS LA DIFERENCIA</p>
    </header>

    <!-- Contenedor del carrusel + flechas -->
    <div class="carousel-wrapper">
      <button class="nav-arrow left" id="prevBtn" aria-label="Anterior">‹</button>
      <div class="carousel" id="carousel"><!-- Las tarjetas se generan por JavaScript --></div>
      <button class="nav-arrow right" id="nextBtn" aria-label="Siguiente">›</button>
    </div>

    <!-- Puntos indicadores -->
    <div class="dots" id="dots"><!-- Se generan por JavaScript --></div>

    <footer class="credito">Desliza, usa las flechas o el teclado para navegar</footer>
  </div>

  <!-- Canvas oculto usado únicamente para extraer el color dominante -->
  <canvas id="colorCanvas" style="display:none;"></canvas>

  <script src="index.js"></script>
</body>
</html>
